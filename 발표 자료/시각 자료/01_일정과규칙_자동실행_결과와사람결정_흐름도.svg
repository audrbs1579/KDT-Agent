<svg xmlns="http://www.w3.org/2000/svg" width="961" height="556" viewBox="767 307 961 556" role="img" aria-labelledby="title desc"><title id="title">01_일정과규칙_자동실행_결과와사람결정_흐름도</title><desc id="desc">중요한 결정과 예외는 사람에게 연결합니다 개발 목표 · 절감 시간과 무인 처리율은 실제 검증 후 측정</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif} text{font-kerning:normal} </style><rect x="800" y="340" width="400" height="175" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="800" y="340" width="6" height="175" fill="#3156D9"/><text x="828" y="393" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">일정·규칙</text><text x="828" y="444" font-size="28" fill="#627084" font-weight="400" text-anchor="start">기수별 운영 기준</text><line x1="1212" y1="427.5" x2="1282" y2="427.5" stroke="#3156D9" stroke-width="3" /><path d="M 1270 420.5 L 1282 427.5 L 1270 434.5" fill="none" stroke="#3156D9" stroke-width="3"/><rect x="1295" y="340" width="400" height="175" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="1295" y="340" width="6" height="175" fill="#3156D9"/><text x="1323" y="393" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">자동 실행</text><text x="1323" y="444" font-size="28" fill="#627084" font-weight="400" text-anchor="start">예약과 도구 실행</text><rect x="800" y="650" width="400" height="180" rx="12" fill="#E4F3EE" stroke="#D7DFEA" stroke-width="2"/><rect x="800" y="650" width="6" height="180" fill="#007D79"/><text x="828" y="703" font-size="36" fill="#007D79" font-weight="700" text-anchor="start">실행 결과</text><text x="828" y="754" font-size="28" fill="#627084" font-weight="400" text-anchor="start">처리 이력과 완료 근거</text><rect x="1295" y="650" width="400" height="180" rx="12" fill="#FFF1DB" stroke="#D7DFEA" stroke-width="2"/><rect x="1295" y="650" width="6" height="180" fill="#AC6C12"/><text x="1323" y="703" font-size="36" fill="#AC6C12" font-weight="700" text-anchor="start">사람의 결정</text><text x="1323" y="754" font-size="28" fill="#6270