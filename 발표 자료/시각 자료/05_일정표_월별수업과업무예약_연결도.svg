<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="386" viewBox="63 287 1760 386" role="img" aria-labelledby="title desc"><title id="title">05_일정표_월별수업과업무예약_연결도</title><desc id="desc">Teams 채널 수업은 1개월 단위로 발행합니다 설계안 · 기능별 실제 연결·실행은 검증 대상</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif} text{font-kerning:normal} </style><rect x="96" y="370" width="380" height="230" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="96" y="370" width="6" height="230" fill="#3156D9"/><text x="124" y="423" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">기준 일정표</text><text x="124" y="474" font-size="28" fill="#627084" font-weight="400" text-anchor="start">기수·수업일·과목</text><text x="124" y="516" font-size="28" fill="#627084" font-weight="400" text-anchor="start">시작·종료·담당 강사</text><line x1="495" y1="485" x2="595" y2="485" stroke="#3156D9" stroke-width="3" /><path d="M 583 478 L 595 485 L 583 492" fill="none" stroke="#3156D9" stroke-width="3"/><rect x="620" y="370" width="380" height="230" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="620" y="370" width="6" height="230" fill="#3156D9"/><text x="648" y="423" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">월별 수업 발행</text><text x="648" y="474" font-size="28" fill="#627084" font-weight="400" text-anchor="start">Teams 채널 수업</text><text x="648" y="516" font-size="28" fill="#627084" font-weight="400" text-anchor="start">실제 참가 링크 확인</text><line x1="1020" y1="485" x2="1120" y2="485" stroke="#3156D9" stroke-width="3" /><path d="M 1108 478 L 1120 485 L 1108 492" fill="none" stroke="#3156D9" stroke-width="3"/><rect x="1140" y="320" width="650" height="140" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="1140" y="320" width="6" height="140" fill="#007D79"/><text x="1168" y="373" font-size="36" fill="#007D79" font-weight="700" text-anchor="start">직원 Outlook</text><text x="1168" y="424" font-size="28" fill="#627084" font-w