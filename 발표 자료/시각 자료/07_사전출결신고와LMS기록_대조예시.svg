<svg xmlns="http://www.w3.org/2000/svg" width="1794" height="558" viewBox="63 280 1794 558" role="img" aria-labelledby="title desc"><title id="title">07_사전출결신고와LMS기록_대조예시</title><desc id="desc">예정 시각과 실제 기록을 대조해 잘못된 미클릭 독촉을 막습니다 사전 신고·시각은 예시 · 유예와 공식 인정 기준은 과정별 규칙 적용</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif} text{font-kerning:normal} </style><text x="116" y="339" font-size="31" fill="#627084" font-weight="700" text-anchor="start">신고 유형</text><text x="366" y="339" font-size="31" fill="#627084" font-weight="700" text-anchor="start">게시판 사전 예정</text><text x="841" y="339" font-size="31" fill="#627084" font-weight="700" text-anchor="start">실제 기록 확인</text><text x="1316" y="339" font-size="31" fill="#627084" font-weight="700" text-anchor="start">다음 조치</text><rect x="96" y="380" width="1728" height="125" rx="0" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="116" y="453" font-size="31" fill="#3156D9" font-weight="700" text-anchor="start">지각 예정</text><text x="366" y="453" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">10:00 입실 예정</text><text x="841" y="453" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">09:10 입실 미확인</text><text x="1316" y="453" font-size="29" fill="#14263D" font-weight="400" text-anchor="start">10:00 + 유예 후 재조회</text><rect x="96" y="530" width="1728" height="125" rx="0" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="116" y="603" font-size="31" fill="#3156D9" font-weight="700" text-anchor="start">조퇴 예정</text><text x="366" y="603" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">16:00 퇴실 예정</text><text x="841" y="603" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">16:02 퇴실 기록</text><text x="1316" y="603" font-size="29" fill="#14263D" font-weight="400" text-anchor="start">18시 일반 독촉 생략</text><rect x="96" y="680" width="1728" height="125" rx="0" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="116" y="753" font-size="31" fill="#3156D9" font-weight="700" text-anchor="start">외출 예정</text><text x="366" y="753" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">14:00~15:00 외출</text><text x="841" y="753" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">14:20 중간 미응답</text><text x="1316" y="753" font-size="29" fill="#14263D" font-weight="400" text-anchor="start">외출 구간 조정·복귀 확인</text></svg>
