<svg xmlns="http://www.w3.org/2000/svg" width="1795" height="691" viewBox="63 257 1795 691" role="img" aria-labelledby="title desc"><title id="title">10_과정종료1회_선택형2개_주관식1개_Forms구조</title><desc id="desc">5점 선택형 2개와 주관식 1개로 통일합니다 양식 구상 · 일별·중간·특강·멘토링 만족도는 별도 운영하지 않음</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif} text{font-kerning:normal} </style><rect x="96" y="290" width="1290" height="625" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="96" y="290" width="1290" height="10" fill="#007D79"/><text x="136" y="355" font-size="38" fill="#14263D" font-weight="700" text-anchor="start">A기수  과정 종료 만족도 조사</text><text x="136" y="400" font-size="28" fill="#627084" font-weight="400" text-anchor="start">과정명·기수·교육 기간·종료일 자동 표시</text><text x="605" y="472" font-size="24" fill="#627084" font-weight="600" text-anchor="middle">매우 그렇다</text><text x="755" y="472" font-size="24" fill="#627084" font-weight="600" text-anchor="middle">그렇다</text><text x="905" y="472" font-size="24" fill="#627084" font-weight="600" text-anchor="middle">보통</text><text x="1055" y="472" font-size="24" fill="#627084" font-weight="600" text-anchor="middle">아니다</text><text x="1205" y="472" font-size="24" fill="#627084" font-weight="600" text-anchor="middle">매우 아니다</text><line x1="136" y1="570" x2="1344" y2="570" stroke="#D7DFEA" stroke-width="3" /><text x="136" y="530" font-size="30" fill="#14263D" font-weight="600" text-anchor="start">Q1  교안·수강 자료 준비도</text><circle cx="605" cy="520" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="755" cy="520" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="905" cy="520" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="1055" cy="520" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="1205" cy="520" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><line x1="136" y1="665" x2="1344" y2="665" stroke="#D7DFEA" stroke-width="3" /><text x="136" y="625" font-size="30" fill="#14263D" font-weight="600" text-anchor="start">Q2  설명의 명확성·전달력</text><circle cx="605" cy="615" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="755" cy="615" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="905" cy="615" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="1055" cy="615" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><circle cx="1205" cy="615" r="15" fill="#FFFFFF" stroke="#627084" stroke-width="2"/><text x="136" y="738" font-size="30" fill="#14263D" font-weight="600" text-anchor="start">Q3  좋았던 점·보완점·개선 의견</text><rect x="136" y="768" width="1208" height="100" rx="5" fill="#F7F9FC" stroke="#D7DFEA" stroke-width="2"/><text x="165" y="827" font-size="28" fill="#627084" font-weight="400" text-anchor="start">자유롭게 적어주세요  (선택)</text><text x="1450" y="350" font-size="27" fill="#3156D9" font-weight="700" text-anchor="start">종료 조건</text><rect x="1435" y="385" width="390" height="170" rx="12" fill="#E4F3EE" stroke="#D7DFEA" stroke-width="2"/><rect x="1435" y="385" width="6" height="170" fill="#007D79"/><text x="1463" y="438" font-size="36" fill="#007D79" font-weight="700" text-anchor="start">A과정 종료</text><text x="1463" y="489" font-size="28" fill="#627084" font-weight="400" text-anchor="start">기본 안내 1회</text><rect x="1435" y="600" width="390" height="170" rx="12" fill="#F7F9FC" stroke="#D7DFEA" stroke-width="2"/><rect x="1435" y="600" width="6" height="170" fill="#627084"/><text x="1463" y="653" font-size="36" fill="#627084" font-weight="700" text-anchor="start">B과정 운영 중</text><text x="1463" y="704" font-size="28" fill="#627084" font-weight="400" text-anchor="start">만족도 발송 없음</text></svg>
