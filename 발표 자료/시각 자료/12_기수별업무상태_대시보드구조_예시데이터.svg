<svg xmlns="http://www.w3.org/2000/svg" width="1794" height="511" viewBox="63 352 1794 511" role="img" aria-labelledby="title desc"><title id="title">12_기수별업무상태_대시보드구조_예시데이터</title><desc id="desc">운영 중인 기수와 종료한 과정의 상태를 함께 확인합니다 대시보드 구상 · 모든 수치·상태는 가상 예시이며 실제 연결 화면이 아님</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif} text{font-kerning:normal} </style><rect x="96" y="385" width="1728" height="445" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="135" y="450" font-size="28" fill="#627084" font-weight="700" text-anchor="start">기수</text><text x="435" y="450" font-size="28" fill="#627084" font-weight="700" text-anchor="start">과정 상태</text><text x="755" y="450" font-size="28" fill="#627084" font-weight="700" text-anchor="start">강사 준비</text><text x="1035" y="450" font-size="28" fill="#627084" font-weight="700" text-anchor="start">출결 대조</text><text x="1340" y="450" font-size="28" fill="#627084" font-weight="700" text-anchor="start">학습 지원</text><text x="1580" y="450" font-size="28" fill="#627084" font-weight="700" text-anchor="start">만족도</text><line x1="135" y1="580" x2="1780" y2="580" stroke="#D7DFEA" stroke-width="3" /><text x="135" y="535" font-size="34" fill="#3156D9" font-weight="700" text-anchor="start">A기수</text><text x="435" y="535" font-size="27" fill="#14263D" font-weight="400" text-anchor="start">과정 종료</text><text x="755" y="535" font-size="27" fill="#14263D" font-weight="400" text-anchor="start">자료 확인</text><text x="1035" y="535" font-size="27" fill="#AC6C12" font-weight="400" text-anchor="start">확인 1건</text><text x="1340" y="535" font-size="27" fill="#AC6C12" font-weight="400" text-anchor="start">검수 대기</text><text x="1580" y="535" font-size="27" fill="#14263D" font-weight="400" text-anchor="start">응답 20/25</text><line x1="135" y1="690" x2="1780" y2="690" stroke="#D7DFEA" stroke-width="3" /><text x="135" y="645" font-size="34" fill="#3156D9" font-weight="700" text-anchor="start">B기수</text><text x="435" y="645" font-