<svg xmlns="http://www.w3.org/2000/svg" width="1792" height="572" viewBox="64 277 1792 572" role="img" aria-labelledby="title desc"><title id="title">14_운영사건_근거와담당업무_연결도</title><desc id="desc">근거·담당자·기한과 처리 상태를 함께 연결합니다 설계안 · 기능별 실제 연결·실행은 검증 대상</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif} text{font-kerning:normal} </style><text x="96" y="337" font-size="32" fill="#627084" font-weight="700" text-anchor="start">감지한 사건</text><text x="686" y="337" font-size="32" fill="#627084" font-weight="700" text-anchor="start">연결하는 근거</text><text x="1276" y="337" font-size="32" fill="#627084" font-weight="700" text-anchor="start">다음 업무</text><line x1="96" y1="505" x2="1824" y2="505" stroke="#D7DFEA" stroke-width="3" /><text x="96" y="448" font-size="37" fill="#3156D9" font-weight="700" text-anchor="start">교안 준비 지연</text><text x="686" y="448" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">제출 상태와 안내 이력</text><text x="1276" y="448" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">담당 강사 재확인</text><line x1="96" y1="660" x2="1824" y2="660" stroke="#D7DFEA" stroke-width="3" /><text x="96" y="603" font-size="37" fill="#3156D9" font-weight="700" text-anchor="start">출결 기록 상충</text><text x="686" y="603" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">사전 신고·LMS·호명</text><text x="1276" y="603" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">매니저 예외 확인</text><line x1="96" y1="815" x2="1824" y2="815" stroke="#D7DFEA" stroke-width="3" /><text x="96" y="758" font-size="37" fill="#3156D9" font-weight="700" text-anchor="start">질문 답변 지연</text><text x="686" y="758" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">질문 원문·답변 상태</text><text x="1276" y="758" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">담당 강사 응답 요청</text></svg>
