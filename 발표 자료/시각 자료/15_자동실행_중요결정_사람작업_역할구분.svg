<svg xmlns="http://www.w3.org/2000/svg" width="1842" height="626" viewBox="39 277 1842 626" role="img" aria-labelledby="title desc"><title id="title">15_자동실행_중요결정_사람작업_역할구분</title><desc id="desc">최대한 자동화하되 현재 남는 검수·게시 단계도 표시합니다 설계안 · 기능별 실제 연결·실행은 검증 대상</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif} text{font-kerning:normal} </style><rect x="72" y="310" width="568" height="560" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="676" y="310" width="568" height="560" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="1280" y="310" width="568" height="560" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><line x1="96" y1="330" x2="616" y2="330" stroke="#3156D9" stroke-width="8" /><text x="96" y="395" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">자동 실행 개발 대상</text><text x="96" y="505" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">일정·예약·안내</text><text x="96" y="600" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">사전 신고·LMS 대조</text><text x="96" y="695" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">자료 처리·집계</text><text x="96" y="790" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">과정 종료 Forms</text><line x1="700" y1="330" x2="1220" y2="330" stroke="#007D79" stroke-width="8" /><text x="700" y="395" font-size="36" fill="#007D79" font-weight="700" text-anchor="start">중요한 결정·예외</text><text x="700" y="505" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">공식 출결 인정·정정</text><text x="700" y="600" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">증빙 최종 승인·반려</text><text x="700" y="695" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">대외 자료 제공</text><text x="700" y="790" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">인증·규칙 밖 예외</text><line x1="1304" y1="330" x2="1824" y2="330" stroke="#AC6C12" stroke-width="8" /><text x="1304" y="395" font-size="36" fill="#AC6C12" font-weight="700" text-anchor="start">현재 남는 사람 작업</text><text x="1304" y="505" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">원본 문서 공동 편집</text><text x="1304" y="600" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">퀴즈 문항 검수</text><text x="1304" y="695" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">정답·배점·Forms 게시</text><text x="1304" y="790" font-size="32" fill="#14263D" font-weight="500" text-anchor="start">다른 목적 양식의 지정 단계</text></svg>
