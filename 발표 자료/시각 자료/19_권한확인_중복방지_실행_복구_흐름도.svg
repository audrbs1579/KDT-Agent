<svg xmlns="http://www.w3.org/2000/svg" width="1771" height="539" viewBox="63 317 1771 539" role="img" aria-labelledby="title desc"><title id="title">19_권한확인_중복방지_실행_복구_흐름도</title><desc id="desc">외부 결과가 불명확하면 기존 실행을 대조한 뒤 처리합니다 설계안 · 기능별 실제 연결·실행은 검증 대상</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;font-kerning:normal} </style><rect x="96" y="350" width="355" height="185" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="96" y="350" width="6" height="185" fill="#3156D9"/><text x="124" y="403" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">권한·대상 검사</text><text x="124" y="454" font-size="28" fill="#627084" font-weight="400" text-anchor="start">허용 범위 확인</text><line x1="463" y1="442.5" x2="533" y2="442.5" stroke="#3156D9" stroke-width="3" /><path d="M 521 435.5 L 533 442.5 L 521 449.5" fill="none" stroke="#3156D9" stroke-width="3"/><rect x="546" y="350" width="355" height="185" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="546" y="350" width="6" height="185" fill="#3156D9"/><text x="574" y="403" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">중복 실행 검사</text><text x="574" y="454" font-size="28" fill="#627084" font-weight="400" text-anchor="start">기수·업무 실행 키</text><line x1="913" y1="442.5" x2="983" y2="442.5" stroke="#3156D9" stroke-width="3" /><path d="M 971 435.5 L 983 442.5 L 971 449.5" fill="none" stroke="#3156D9" stroke-width="3"/><rect x="996" y="350" width="355" height="185" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="996" y="350" width="6" height="185" fill="#3156D9"/><text x="1024" y="403" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">도구 실행</text><text x="1024" y="454" font-size="28" fill="#627084" font-weight="400" text-anchor="start">최신 상태 재확인</text><line x1="1363" y1="442.5" x2="1433" y2="442.5" stroke="#3156D9" stroke-width="3" /><path d="M 1421 435.5 L 1433 442.5 L 1421 449.5" fill="none" stroke="#3156D9" stroke-width="3"/><rect x="1446" y="350" width="355" height="185" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="1446" y="350" width="6" height="185" fill="#3156D9"/><text x="1474" y="403" font-size="36" fill="#3156D9" font-weight="700" text-anchor="start">결과 확인</text><text x="1474" y="454" font-size="28" fill="#627084" font-weight="400" text-anchor="start">완료 조건·증거</text><line x1="96" y1="690" x2="616" y2="690" stroke="#AC6C12" stroke-width="6" /><text x="96" y="752" font-size="35" fill="#AC6C12" font-weight="700" text-anchor="start">권한·대상 불명</text><text x="96" y="821" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">확인 대기</text><line x1="686" y1="690" x2="1206" y2="690" stroke="#B54443" stroke-width="6" /><text x="686" y="752" font-size="35" fill="#B54443" font-weight="700" text-anchor="start">실패·수집 장애</text><text x="686" y="821" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">기록 후 복구</text><line x1="1276" y1="690" x2="1796" y2="690" stroke="#7357B8" stroke-width="6" /><text x="1276" y="752" font-size="35" fill="#7357B8" font-weight="700" text-anchor="start">외부 결과 불명</text><text x="1276" y="821" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">무조건 재발송하지 않음</text></svg>
