<svg xmlns="http://www.w3.org/2000/svg" width="1836" height="631" viewBox="39 282 1836 631" role="img" aria-labelledby="title desc"><title id="title">20_확인사실_운영기준_구현경로_미검증_분류도</title><desc id="desc">조회 기록·운영 기준·제품 기능·실제 실행 성공은 서로 다른 근거입니다 근거: 설계보고서 06·07 및 F06·F19 · 조회 시점과 실제 실행 검증 범위를 구분</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;font-kerning:normal} </style><rect x="72" y="315" width="1770" height="130" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="460" width="1770" height="130" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="605" width="1770" height="130" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="750" width="1770" height="130" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><line x1="96" y1="440" x2="1824" y2="440" stroke="#D7DFEA" stroke-width="3" /><text x="96" y="388" font-size="37" fill="#3156D9" font-weight="700" text-anchor="start">기록된 확인 사실</text><text x="610" y="388" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">당시 계정·구독·관리자 역할 조회</text><text x="1800" y="388" font-size="28" fill="#3156D9" font-weight="600" text-anchor="end">조회 기록</text><line x1="96" y1="585" x2="1824" y2="585" stroke="#D7DFEA" stroke-width="3" /><text x="96" y="533" font-size="37" fill="#007D79" font-weight="700" text-anchor="start">사용자 운영 기준</text><text x="610" y="533" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">기수별 일정·종료 설문·출결 게시판</text><text x="1800" y="533" font-size="28" fill="#007D79" font-weight="600" text-anchor="end">요구사항 반영</text><line x1="96" y1="730" x2="1824" y2="730" stroke="#D7DFEA" stroke-width="3" /><text x="96" y="678" font-size="37" fill="#7357B8" font-weight="700" text-anchor="start">구현 경로</text><text x="610" y="678" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">응답 커넥터·서버·브라우저 절차</text><text x="1800" y="678" font-size="28" fill="#7357B8" font-weight="600" text-anchor="end">공식 기능·설계</text><line x1="96" y1="875" x2="1824" y2="875" stroke="#D7DFEA" stroke-width="3" /><text x="96" y="823" font-size="37" fill="#AC6C12" font-weight="700" text-anchor="start">남은 실제 검증</text><text x="610" y="823" font-size="31" fill="#14263D" font-weight="400" text-anchor="start">UI·OAuth·권한·LMS 대조·반복 실행</text><text x="1800" y="823" font-size="28" fill="#AC6C12" font-weight="600" text-anchor="end">연결 확인 필요</text></svg>
