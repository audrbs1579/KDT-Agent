<svg xmlns="http://www.w3.org/2000/svg" width="1836" height="596" viewBox="39 282 1836 596" role="img" aria-labelledby="title desc"><title id="title">22_대상분리_종료조건_원본대조_복구_개입기록_검증항목</title><desc id="desc">아래 항목은 검증 계획이며 달성한 성능 수치가 아닙니다 POC 통과 기준 · 정확도·절감률·성공률의 실측 결과가 아님</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;font-kerning:normal} </style><rect x="72" y="315" width="1770" height="90" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="425" width="1770" height="90" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="535" width="1770" height="90" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="645" width="1770" height="90" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="755" width="1770" height="90" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><circle cx="120" cy="355" r="16" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="160" y="369" font-size="32" fill="#3156D9" font-weight="700" text-anchor="start">대상 분리</text><text x="520" y="369" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">기수·학생·과정·채널 분리</text><line x1="96" y1="400" x2="1824" y2="400" stroke="#D7DFEA" stroke-width="3" /><circle cx="120" cy="465" r="16" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="160" y="479" font-size="32" fill="#3156D9" font-weight="700" text-anchor="start">종료 조건</text><text x="520" y="479" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">과정 종료 시 기본 발송 1회</text><line x1="96" y1="510" x2="1824" y2="510" stroke="#D7DFEA" stroke-width="3" /><circle cx="120" cy="575" r="16" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="160" y="589" font-size="32" fill="#3156D9" font-weight="700" text-anchor="start">원본 대조</text><text x="520" y="589" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">원천과 수치·상태 일치</text><line x1="96" y1="620" x2="1824" y2="620" stroke="#D7DFEA" stroke-width="3" /><circle cx="120" cy="685" r="16" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="160" y="699" font-size="32" fill="#3156D9" font-weight="700" text-anchor="start">중복·복구</text><text x="520" y="699" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">재시도·변경·단절 처리</text><line x1="96" y1="730" x2="1824" y2="730" stroke="#D7DFEA" stroke-width="3" /><circle cx="120" cy="795" r="16" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><text x="160" y="809" font-size="32" fill="#3156D9" font-weight="700" text-anchor="start">사람 개입</text><text x="520" y="809" font-size="30" fill="#14263D" font-weight="400" text-anchor="start">개입 사유·횟수·시간·비용</text><line x1="96" y1="840" x2="1824" y2="840" stroke="#D7DFEA" stroke-width="3" /></svg>
