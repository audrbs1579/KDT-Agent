<svg xmlns="http://www.w3.org/2000/svg" width="1835" height="506" viewBox="39 277 1835 506" role="img" aria-labelledby="title desc"><title id="title">23_일반코드와AI모델_업무역할_구분도</title><desc id="desc">모델은 품질·수정률·응답 시간·비용을 보고 조정합니다 모델 선택 원칙 · 특정 모델의 성능 순위나 최신 단가를 제시한 자료가 아님</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;font-kerning:normal} </style><rect x="72" y="310" width="835" height="440" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="1006" y="310" width="835" height="440" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><line x1="96" y1="335" x2="880" y2="335" stroke="#3156D9" stroke-width="8" /><line x1="1030" y1="335" x2="1814" y2="335" stroke="#7357B8" stroke-width="8" /><text x="96" y="405" font-size="44" fill="#3156D9" font-weight="700" text-anchor="start">일반 코드·SQL</text><text x="1030" y="405" font-size="44" fill="#7357B8" font-weight="700" text-anchor="start">AI 모델</text><text x="96" y="505" font-size="34" fill="#14263D" font-weight="400" text-anchor="start">문항·제목의 정해진 값 치환</text><text x="96" y="580" font-size="34" fill="#14263D" font-weight="400" text-anchor="start">날짜·조건·권한 검사</text><text x="96" y="655" font-size="34" fill="#14263D" font-weight="400" text-anchor="start">점수·분포·응답 수 계산</text><text x="1030" y="505" font-size="34" fill="#14263D" font-weight="400" text-anchor="start">문서·주관식 의미 정리</text><text x="1030" y="580" font-size="34" fill="#14263D" font-weight="400" text-anchor="start">근거가 있는 초안·요약</text><text x="1030" y="655" font-size="34" fill="#14263D" font-weight="400" text-anchor="start">모호한 내용은 확인 필요 표시</text></svg>
