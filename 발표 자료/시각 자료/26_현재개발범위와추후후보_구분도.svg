<svg xmlns="http://www.w3.org/2000/svg" width="1835" height="626" viewBox="39 277 1835 626" role="img" aria-labelledby="title desc"><title id="title">26_현재개발범위와추후후보_구분도</title><desc id="desc">현재 기능의 검증을 거쳐 필요한 범위부터 확대합니다 범위: 설계보고서 00·11 · 만족도는 과정 종료 단일 양식을 유지</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;font-kerning:normal} </style><rect x="72" y="310" width="835" height="560" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="1006" y="310" width="835" height="560" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><line x1="96" y1="330" x2="900" y2="330" stroke="#3156D9" stroke-width="8" /><line x1="1030" y1="330" x2="1824" y2="330" stroke="#627084" stroke-width="8" /><text x="96" y="400" font-size="42" fill="#3156D9" font-weight="700" text-anchor="start">현재 설계·개발 범위</text><text x="1030" y="400" font-size="42" fill="#627084" font-weight="700" text-anchor="start">추후 후보</text><text x="96" y="505" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">일정·규칙·강사 소통</text><text x="96" y="580" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">사전 출결 신고·LMS 대조</text><text x="96" y="655" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">자료 처리·학습 지원</text><text x="96" y="730" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">과정 종료 3항목 Forms</text><text x="96" y="805" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">대시보드·비용 관리</text><text x="1030" y="505" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">실행 경험 개선 후보 생성</text><text x="1030" y="580" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">필요 기수의 카카오톡 연결</text><text x="1030" y="655" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">단위기간 제출 패키지</text><text x="1030" y="730" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">출결 종합 기능 내재화</text><text x="1030" y="805" font-size="33" fill="#14263D" font-weight="400" text-anchor="start">다른 목적 Forms·퀴즈 범용화</text></svg>
