<svg xmlns="http://www.w3.org/2000/svg" width="1836" height="638" viewBox="39 277 1836 638" role="img" aria-labelledby="title desc"><title id="title">27_첫대상_자료_연결책임_운영규칙_검증확대_준비항목</title><desc id="desc">대상·자료·연결 책임·운영 규칙과 검증 기준을 정합니다 워크샵 준비 항목 · 만족도 문항·주기는 과정 종료 1회·선택형 2개·주관식 1개로 적용</desc><style>text{font-family:'Malgun Gothic','맑은 고딕','Noto Sans KR',sans-serif;font-kerning:normal} </style><rect x="72" y="310" width="1770" height="100" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="428" width="1770" height="100" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="546" width="1770" height="100" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="664" width="1770" height="100" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><rect x="72" y="782" width="1770" height="100" rx="12" fill="#FFFFFF" stroke="#D7DFEA" stroke-width="2"/><circle cx="125" cy="355" r="24" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="125" y="366" font-size="25" fill="#3156D9" font-weight="700" text-anchor="middle">1</text><text x="180" y="368" font-size="35" fill="#3156D9" font-weight="700" text-anchor="start">첫 대상</text><text x="640" y="368" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">시험용 과정·적용 후보</text><line x1="96" y1="404" x2="1824" y2="404" stroke="#D7DFEA" stroke-width="3" /><circle cx="125" cy="473" r="24" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="125" y="484" font-size="25" fill="#3156D9" font-weight="700" text-anchor="middle">2</text><text x="180" y="486" font-size="35" fill="#3156D9" font-weight="700" text-anchor="start">허용 자료</text><text x="640" y="486" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">일정·명단·자료·출결 원천</text><line x1="96" y1="522" x2="1824" y2="522" stroke="#D7DFEA" stroke-width="3" /><circle cx="125" cy="591" r="24" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="125" y="602" font-size="25" fill="#3156D9" font-weight="700" text-anchor="middle">3</text><text x="180" y="604" font-size="35" fill="#3156D9" font-weight="700" text-anchor="start">연결 책임</text><text x="640" y="604" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">계정·권한·인증 복구</text><line x1="96" y1="640" x2="1824" y2="640" stroke="#D7DFEA" stroke-width="3" /><circle cx="125" cy="709" r="24" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="125" y="720" font-size="25" fill="#3156D9" font-weight="700" text-anchor="middle">4</text><text x="180" y="722" font-size="35" fill="#3156D9" font-weight="700" text-anchor="start">운영 규칙</text><text x="640" y="722" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">출결 대조·종료 조건·응답 기한</text><line x1="96" y1="758" x2="1824" y2="758" stroke="#D7DFEA" stroke-width="3" /><circle cx="125" cy="827" r="24" fill="#EAF0FF" stroke="none" stroke-width="2"/><text x="125" y="838" font-size="25" fill="#3156D9" font-weight="700" text-anchor="middle">5</text><text x="180" y="840" font-size="35" fill="#3156D9" font-weight="700" text-anchor="start">검증·확대</text><text x="640" y="840" font-size="32" fill="#14263D" font-weight="400" text-anchor="start">통과 기준·예외·비용 기록</text><line x1="96" y1="876" x2="1824" y2="876" stroke="#D7DFEA" stroke-width="3" /></svg>
