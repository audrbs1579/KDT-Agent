{part:'A · 시작과 목표',title:'KDT 교육 PM 에이전트',status:'설계 방향',take:'KDT 운영 자료를 연결해 매니저의 판단을 돕는다',note:'KDT 운영을 하면서 매일 확인해야 하는 자료와 업무가 많습니다. 이 자료를 연결해 지금 어떤 상황이고 어떤 조치가 필요한지 보려는 구상입니다.',dark:true,visual:`<div class="row" style="width:100%;gap:35px"><div class="col" style="width:29%;gap:18px"><div class="outline center">강사</div><div class="outline center">수강생</div><div class="outline center">수업</div></div><div class="line-arrow"></div><div style="width:45%;background:#1e514d;border:1px solid #59947b;border-radius:17px;padding:40px"><div class="tiny muted">KDT A기수</div><div class="big" style="margin:22px 0;color:#b5eac8">오늘의 운영</div><div class="row between small"><span>수업 일정</span><span>확인할 업무</span></div><div class="under" style="background:#4d8074"></div><div class="row between small"><span>원천 상태</span><span>매니저 조치</span></div></div></div>`},

{part:'B · 운영의 하루',title:'일정 변경이 생기면',status:'설계안',take:'일정이 바뀌면 연결된 예약과 담당 업무도 다시 확인한다',note:'일정 수정은 기존 예약과 새로운 예약의 중복을 막아야 합니다. 누가 받는지 불명확한 안내는 대기로 둡니다.',visual:`<div class="grid2"><div class="panel" style="height:300px"><div class="tiny muted">변경 전</div><div class="medium" style="margin:25px 0">10.27 · 강사 A</div><div class="rule-row">준비 안내 <span class="chip">예약</span></div><div class="rule-row">강의 설문 <span class="chip">예약</span></div></div><div class="panel" style="height:300px;background:#edf5ee"><div class="tiny muted">변경 후</div><div class="medium" style="margin:25px 0">10.28 · 강사 B</div><div class="rule-row">안내 대상 <span class="chip warn">재확인</span></div><div class="rule-row">설문 예약 <span class="chip warn">대기</span></div></div></div>`},

{part:'C · 자료와 연결',title:'Forms 응답이 들어오는 과정',status:'설계안',take:'설문 응답은 Forms에서 사람이 내려받은 Excel로 들어온다',note:'담당자가 문항을 검수하고 Forms를 게시합니다. 응답 Excel을 내려받아 전달하면 에이전트가 검사와 집계를 합니다.',visual:`<div class="flow"><div class="unit human"><h3>Forms</h3><p>문항 검수<br>게시</p><div style="margin-top:25px"><span class="chip warn">담당자</span></div></div><div class="arr">→</div><div class="unit human"><h3>Excel 다운로드</h3><p>응답 사본<br>전달</p><div style="margin-top:25px"><span class="chip warn">담당자</span></div></div><div class="arr">→</div><div class="unit"><h3>검증</h3><p>버전·응답 ID<br>중복 검사</p><div style="margin-top:25px"><span class="chip">에이전트</span></div></div><div class="arr">→</div><div class="unit"><h3>집계</h3><p>응답률·점수<br>기준 시각</p><div style="margin-top:25px"><span class="chip">에이전트</span></div></div></div>`},

const root=document.getElementById('slide'),counter=document.getElementById('count'),notes=document.getElementById('notes');let current=0;function fit(){const s=Math.min((innerWidth-36)/1440,(innerHeight-70)/810);root.style.transform=`scale(${Math.max(.15,s)})`;}function show(n){current=Math.max(0,Math.min(slides.length-1,n));const d=slides[current];root.className='slide'+(d.dark?' dark':'');root.innerHTML=`<div class="part">${d.part}</div><h1>${d.title}</h1><span class="status">${d.status}</span><div class="main">${d.visual}</div><div class="takeaway">${d.take}</div><div class="page">${String(current+1).padStart(2,'0')} / ${slides.length}</div>`;notes.textContent=d.note;counter.textContent=String(current+1).padStart(2,'0')+' / '+slides.length;document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#'+(current+1));fit()};document.getElementById('prev').onclick=()=>show(current-1);document.getElementById('next').onclick=()=>show(current+1);document.getElementById('note').onclick=()=>notes.classList.toggle('on');document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='n')notes.classList.toggle('on')});window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(n&&n!==current+1)show(n-1)});window.addEventListener('resize',fit);show(Number(location.hash.slice(1)||1)-1);
</script></body></html>
