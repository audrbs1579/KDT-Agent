<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1100" style="max-width:100%;height:auto" viewBox="0 0 1200 1100" role="img" aria-labelledby="title desc">
  <title id="title">교육운영 AI PM 전체 구조</title>
  <desc id="desc">일정 기반 업무를 예약·실행하며 사용자 제공 구조 예시에 따라 수강생 팀 일반, 기수별 운영 채널, 강사팀의 파일 범위를 구분한다. 수강생 파일은 일반 안에서만 공유하고 강사 출석부 원본과 운영 채널 내부 보관본을 구분한다. 이름은 변경 가능한 참고값이며 실제 ID·권한·연동은 별도 확인한다.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4973aa"/></marker></defs>
  <rect width="1200" height="1100" rx="20" fill="#f2f6fc"/>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif" text-anchor="middle" fill="#19324f">
    <text x="600" y="49" font-size="28" font-weight="700">하나의 AI PM, 역할이 분리된 운영 시스템</text>
    <text x="600" y="80" font-size="16">운영 인프라: @msacademy 계정의 회사 ‘엘릭서’ 구독</text>
    <rect x="230" y="106" width="740" height="80" rx="12" fill="#dceaff" stroke="#aac5ed"/>
    <text x="600" y="139" font-size="21" font-weight="700">직원 Teams 탭 · 웹 대시보드 · 캘린더 일정 연동</text>
    <text x="600" y="167" font-size="16">자동 예약·실행 / 원본 편집·Forms 게시·승인은 사람 담당</text>
    <path d="M600 188 V214" stroke="#4973aa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="120" y="226" width="960" height="94" rx="12" fill="#fff" stroke="#aac5ed"/>
    <text x="600" y="261" font-size="22" font-weight="700">업무 서버 + AI PM</text>
    <text x="600" y="291" font-size="16">Container Apps + Foundry / 일자별 담당강사·과목 파싱 · 권한 확인 · 근거 검색 · 자동 실행 계획</text>
    <path d="M600 322 V345" stroke="#4973aa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="100" y="349" width="1000" height="118" rx="16" fill="#eef7f2" stroke="#7fb396" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="120" y="361" width="450" height="94" rx="12" fill="#e6f3ed" stroke="#93c4a8"/>
    <text x="345" y="396" font-size="20" font-weight="700">규칙 · 예약 · 진행 기억</text>
    <text x="345" y="425" font-size="15">Durable Functions + Durable Task Scheduler</text>
    <rect x="620" y="361" width="460" height="94" rx="12" fill="#e6f3ed" stroke="#93c4a8"/>
    <text x="850" y="396" font-size="20" font-weight="700">작업 대기열 · 분산 처리</text>
    <text x="850" y="425" font-size="16">Service Bus / 몰린 일을 나눠 전달</text>
    <path d="M572 407 H610" stroke="#4973aa" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M600 467 V512" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="50" y="522" width="250" height="95" rx="12" fill="#fff" stroke="#b8c9df"/>
    <text x="175" y="558" font-size="20" font-weight="700">Teams · Outlook</text><text x="175" y="588" font-size="15">메시지 / 일정 / 강의</text>
    <rect x="330" y="522" width="250" height="95" rx="12" fill="#fff" stroke="#b8c9df"/>
    <text x="455" y="558" font-size="20" font-weight="700">문서 · 비용</text><text x="455" y="588" font-size="15">자료 수집 / 검색 / 집계</text>
    <rect x="610" y="522" width="250" height="95" rx="12" fill="#fff" stroke="#b8c9df"/>
    <text x="735" y="558" font-size="20" font-weight="700">웹 자동화</text><text x="735" y="588" font-size="15">Teams 채널 일정 / LMS / 출결</text>
    <rect x="890" y="522" width="260" height="95" rx="12" fill="#fff4e4" stroke="#ddbc81"/>
    <text x="1020" y="558" font-size="20" font-weight="700">PC 자동화 (선택)</text><text x="1020" y="588" font-size="15">Windows 앱 / 필요 업무만 적용</text>
    <path d="M600 628 V654" stroke="#4973aa" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="40" y="669" width="1120" height="280" rx="16" fill="#fff" stroke="#b8c9df"/>
    <text x="600" y="703" font-size="21" font-weight="700">SharePoint 자료: 세 영역을 구분해 연결 (사용자 제공 예시)</text>
    <rect x="60" y="725" width="350" height="172" rx="12" fill="#f0e9fc" stroke="#bba4de"/>
    <text x="235" y="757" font-size="20" font-weight="700">수강생 팀 · 일반 / 공유 탭</text>
    <text x="235" y="789" font-size="15">01. OT · 02. 시간표 · 05. 강의자료</text>
    <text x="235" y="815" font-size="15">06. 프로젝트 · 07. 산출물</text>
    <text x="235" y="841" font-size="15">Recordings / 월 / 주차 / 일자</text>
    <text x="235" y="875" font-size="16" font-weight="700">수강생 파일 공유는 일반 안에서만</text>
    <rect x="425" y="725" width="350" height="172" rx="12" fill="#e5f2eb" stroke="#97c5aa"/>
    <text x="600" y="757" font-size="20" font-weight="700">기수별 운영 채널</text>
    <text x="600" y="789" font-size="15">매뉴얼 · 상담 · 행사 · 설문 결과(예정)</text>
    <text x="600" y="815" font-size="15">출석부 / 월 / 주차 / 일자</text>
    <text x="600" y="841" font-size="15">내부 3종 원본·종합본 별도 보관</text>
    <text x="600" y="875" font-size="16" font-weight="700">소속 팀·실제 ID·권한 별도 확인</text>
    <rect x="790" y="725" width="350" height="172" rx="12" fill="#fff2df" stroke="#ddbc81"/>
    <text x="965" y="757" font-size="20" font-weight="700">강사팀 · 공유 탭</text>
    <text x="965" y="789" font-size="15">양식 · 결과보고서 · 멘토링 일지</text>
    <text x="965" y="815" font-size="15">산출물 · 중간평가문제 · 출석부</text>
    <text x="965" y="841" font-size="15">호명 원본 읽기 / 덮어쓰기 금지</text>
    <text x="965" y="875" font-size="16" font-weight="700">학생 공개 자료와 분리</text>
    <text x="600" y="928" font-size="15">폴더·파일명·날짜·강사명은 참고 예시 / Forms는 사람이 Excel 다운로드 후 저장 / 실제 연동 완료 아님</text>
    <rect x="120" y="965" width="960" height="76" rx="12" fill="#193c67"/>
    <text x="600" y="995" font-size="21" fill="#fff" font-weight="700">공통 업무 장부 · 처리 사본 · 비밀 · 실행 기록</text>
    <text x="600" y="1024" font-size="16" fill="#fff">PostgreSQL / 필요한 Blob 사본 / Key Vault / Azure Monitor</text>
    <text x="600" y="1077" font-size="15">미확인 연결은 대기 / 내부 보관과 승인된 외부 출석 관리 팀 전달은 별도 / 자료 권한은 섞지 않음</text>
  </g>
</svg>
