<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" style="max-width:100%;height:auto" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">세 테넌트 연결 구조</title>
  <desc id="desc">@msacademy의 엘릭서 Azure 구독에 중앙 시스템을 두고 승인된 앱 권한으로 직원·교육 업무를 연결한다. 자료는 수강생 팀 일반, 기수별 운영 채널, 강사팀으로 구분한다. 이는 세 테넌트 구분과 다르며 운영 채널의 소속 팀·실제 ID·권한은 별도 확인한다.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#4973aa"/></marker></defs>
  <rect width="1200" height="850" rx="20" fill="#f2f6fc"/>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif" text-anchor="middle" fill="#19324f">
    <text x="600" y="52" font-size="28" font-weight="700">계정을 하나로 합치지 않고, 허용된 업무를 연결</text>
    <rect x="330" y="107" width="540" height="214" rx="16" fill="#dceaff" stroke="#83a9dd" stroke-width="2"/>
    <text x="600" y="147" font-size="24" font-weight="700">@msacademy — Azure 운영</text>
    <text x="600" y="181" font-size="19">사용할 구독: 회사 ‘엘릭서’</text>
    <text x="600" y="221" font-size="18">AI PM · 대시보드 · 규칙 · DB · 실행기</text>
    <text x="600" y="261" font-size="17">실습 리소스와 운영 권한·비용 분리</text>
    <text x="600" y="293" font-size="15">구독 이름이 회사 계정 테넌트라는 뜻은 아닙니다.</text>
    <path d="M452 323 L286 415" stroke="#4973aa" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
    <path d="M748 323 L914 415" stroke="#4973aa" stroke-width="3" marker-start="url(#a)" marker-end="url(#a)"/>
    <text x="282" y="356" font-size="16">회사 업무용 앱 권한</text>
    <text x="916" y="356" font-size="16">교육 앱 권한 · 웹 실행 계정</text>
    <rect x="65" y="435" width="495" height="186" rx="16" fill="#e5f2eb" stroke="#97c5aa" stroke-width="2"/>
    <text x="312" y="477" font-size="24" font-weight="700">@elixirr — 직원 업무</text>
    <text x="312" y="515" font-size="18">Outlook · 공유 일정 · 사내 Teams</text>
    <text x="312" y="551" font-size="17">직원 보고 · 승인 · 운영국 경보</text>
    <text x="312" y="589" font-size="16">Azure 리소스를 만들 필요 없음</text>
    <rect x="640" y="435" width="495" height="186" rx="16" fill="#f0e9fc" stroke="#bba4de" stroke-width="2"/>
    <text x="887" y="477" font-size="24" font-weight="700">@dataschool — 교육 운영</text>
    <text x="887" y="515" font-size="17">학생: 일반 / 배포 자료·녹화</text>
    <text x="887" y="551" font-size="17">강사: 제출 자료·평가문제·호명 출석부</text>
    <text x="887" y="589" font-size="16">운영: 매뉴얼·상담·설문 결과·내부 출결</text>
    <rect x="65" y="650" width="1070" height="119" rx="12" fill="#fff" stroke="#b8c9df"/>
    <text x="600" y="683" font-size="19" font-weight="700">수강생 일반 · 기수별 운영 채널 · 강사팀은 자료 영역 구분이며, 세 테넌트와 다릅니다.</text>
    <text x="600" y="716" font-size="16">수강생 파일 공유는 일반 안에서만 / 운영 채널 소속 팀·실제 ID·권한 확인 후 연결</text>
    <text x="600" y="747" font-size="16">사용자 제공 폴더 구조는 변경 가능한 참고 예시 / 파일 내용·자동 연동 검증 완료를 뜻하지 않음</text>
    <text x="600" y="817" font-size="17">기준 시간표 지정 → Teams 일반 채널 수업 1개월 생성 → 같은 링크 Outlook 반영 → 강사 안내</text>
  </g>
</svg>
