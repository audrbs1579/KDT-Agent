<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" style="max-width:100%;height:auto" viewBox="0 0 1200 670" role="img" aria-labelledby="title desc">
  <title id="title">컴퓨터 사용과 경험 개선</title>
  <desc id="desc">자료 영역·실제 ID·권한을 확인한 업무만 기존 절차로 실행하거나 제한 탐색한다. 수강생 일반, 기수별 운영 채널, 강사팀을 구분하며 폴더 예시를 검증된 절차로 간주하지 않는다. 자동 개선은 추후 범위이고 실패·불명은 사람에게 전달한다.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4973aa"/></marker></defs>
  <rect width="1200" height="670" rx="20" fill="#f2f6fc"/>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif" text-anchor="middle" fill="#19324f">
    <text x="600" y="50" font-size="28" font-weight="700">처음에는 탐색, 다음에는 검증된 경험 재사용</text>
    <text x="600" y="82" font-size="16">수강생 일반 · 기수별 운영 채널 · 강사팀을 구분 / 폴더 예시는 검증된 실행 절차가 아닙니다.</text>
    <rect x="55" y="132" width="295" height="105" rx="12" fill="#dceaff" stroke="#aac5ed"/>
    <text x="202" y="170" font-size="22" font-weight="700">1. 목표와 범위</text><text x="202" y="206" font-size="15">자료 영역 / 실제 ID·권한 / 완료 조건</text>
    <rect x="455" y="132" width="295" height="105" rx="12" fill="#dceaff" stroke="#aac5ed"/>
    <text x="602" y="170" font-size="22" font-weight="700">2. 경험 검색</text><text x="602" y="206" font-size="16">해당 사이트의 검증된 절차</text>
    <rect x="855" y="132" width="295" height="105" rx="12" fill="#fff2df" stroke="#ddbc81"/>
    <text x="1002" y="170" font-size="22" font-weight="700">3. 실행 또는 탐색</text><text x="1002" y="206" font-size="16">관찰 → 정책 확인 → 클릭</text>
    <path d="M352 184 H443" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M752 184 H843" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M1002 239 V301" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="855" y="315" width="295" height="112" rx="12" fill="#e5f2eb" stroke="#97c5aa"/>
    <text x="1002" y="355" font-size="22" font-weight="700">4. 결과 검증</text><text x="1002" y="390" font-size="15">과정 / 원본 버전 / 보관·공개 범위</text>
    <rect x="455" y="315" width="295" height="112" rx="12" fill="#e5f2eb" stroke="#97c5aa"/>
    <text x="602" y="355" font-size="22" font-weight="700">5. 절차 후보 저장</text><text x="602" y="390" font-size="16">성공 근거와 실패 원인 분리</text>
    <rect x="55" y="315" width="295" height="112" rx="12" fill="#e5f2eb" stroke="#97c5aa"/>
    <text x="202" y="355" font-size="22" font-weight="700">6. 검토 후 적용</text><text x="202" y="390" font-size="16">버전 관리 / 승인 / 운영 반영</text>
    <path d="M853 371 H764" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M453 371 H364" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M202 429 V472 H420 V184 H443" stroke="#4973aa" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#a)"/>
    <rect x="90" y="516" width="1020" height="97" rx="12" fill="#193c67"/>
    <text x="600" y="552" font-size="20" fill="#fff" font-weight="700">실패·결과 불명은 확인 대기로</text>
    <text x="600" y="587" font-size="17" fill="#fff">단계·시간·비용 한도 / MFA는 사람 인증 / 외부 제출·삭제는 승인</text>
    <text x="600" y="648" font-size="15">추후 업데이트 기능(이번 개발 범위 아님). Memory·Optimizer도 추후 검토. 업무 규칙·절차 원본은 DB에 보관.</text>
  </g>
</svg>