<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" style="max-width:100%;height:auto" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">녹화본 접근과 수업 관찰</title>
  <desc id="desc">수강생 팀 일반의 Recordings 아래 월·주차·일자 구조를 참고하되 실제 파일·권한·수업·구간·저장 완료를 확인한다. 출석부와 계층이 유사해도 다른 자료이다. 오전 저장 구간을 퀴즈 근거로 연결하고 안 보이는 학생의 태도는 판정하지 않는다.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#4973aa"/></marker></defs>
  <rect width="1200" height="750" rx="20" fill="#f2f6fc"/>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif" text-anchor="middle" fill="#19324f">
    <text x="600" y="50" font-size="28" font-weight="700">영상을 여는 기능과 사람의 태도를 판정하는 기능은 다릅니다.</text>
    <text x="600" y="80" font-size="16">위치 예시: 수강생 팀 일반 / Recordings / 월 / 주차 / 일자</text>
    <rect x="90" y="99" width="460" height="90" rx="12" fill="#dceaff" stroke="#aac5ed"/>
    <text x="320" y="135" font-size="21" font-weight="700">공식 API · SharePoint 파일</text><text x="320" y="166" font-size="16">    분할 구간·저장 완료·수업 일치 확인</text>
    <rect x="650" y="99" width="460" height="90" rx="12" fill="#fff2df" stroke="#ddbc81"/>
    <text x="880" y="135" font-size="21" font-weight="700">브라우저 · PC로 재생</text><text x="880" y="166" font-size="16">허용된 화면 접근 / 권한 우회 아님</text>
    <path d="M320 192 V223 H600 V253" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M880 192 V223 H600 V253" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="210" y="268" width="780" height="91" rx="12" fill="#fff" stroke="#aac5ed"/>
    <text x="600" y="302" font-size="21" font-weight="700">영상 시각 · 화면 유형 · 관찰 가능 범위 확인</text>
    <text x="600" y="334" font-size="16">전체 학생이 항상 녹화되는 것이 아님 / 화면공유·발언자만 보일 수 있음</text>
    <path d="M410 361 L320 404" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <path d="M790 361 L880 404" stroke="#4973aa" stroke-width="3" fill="none" marker-end="url(#a)"/>
    <rect x="90" y="421" width="460" height="98" rx="12" fill="#e5f2eb" stroke="#97c5aa"/>
    <text x="320" y="457" font-size="21" font-weight="700">확인 가능한 사실·장면</text><text x="320" y="489" font-size="16">시각과 근거를 붙여 담당자 확인</text>
    <rect x="650" y="421" width="460" height="98" rx="12" fill="#fbe8e6" stroke="#dca8a2"/>
    <text x="880" y="457" font-size="21" font-weight="700">안 보임 · 저화질 · 식별 불가</text><text x="880" y="489" font-size="16">관찰 불가로 기록 / 불량 태도 판정 금지</text>
    <text x="600" y="542" font-size="15">저장·분석된 오전 구간 → 오후 퀴즈 초안 / 지연 시 교안·확인된 진도만 사용</text>
    <rect x="170" y="557" width="860" height="59" rx="12" fill="#193c67"/>
    <text x="600" y="594" font-size="19" fill="#fff">객관적 미이행은 별도 규칙으로 안내 · 공식 출결·징계는 사람 판단</text>
    <text x="600" y="651" font-size="16">폴더·날짜는 변경 가능한 참고 예시 / 실제 파일 ID·권한·수업·구간 시각 확인 후 수집</text>
    <text x="600" y="683" font-size="16">월·주차·일자 폴더가 있어도 녹화 자동 정리·생성 완료를 뜻하지 않음</text>
    <text x="600" y="715" font-size="16">운영 채널·강사팀 출석부와 계층만 유사 / 녹화·출석부·개인 증빙은 서로 다른 자료</text>
  </g>
</svg>
